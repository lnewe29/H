<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WHO IS THE LEGEND?</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #67e8f9;
      --purple: #a78bfa;
      --yellow: #fde047;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(103,232,249,.18), transparent 35%),
        radial-gradient(ellipse at 85% 90%, rgba(167,139,250,.2), transparent 35%),
        #080b16;
    }
    .card {
      width: min(100%, 620px); padding: clamp(20px, 5vw, 34px);
      border: 1px solid rgba(255,255,255,.16); border-radius: 26px;
      background: rgba(19, 24, 45, .92);
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
      text-align: center;
    }
    .eyebrow {
      display: inline-block; padding: 7px 12px; border-radius: 999px;
      border: 1px solid rgba(103,232,249,.4); color: var(--cyan);
      font-size: 12px; font-weight: 800; letter-spacing: .16em;
    }
    h1 {
      margin: 16px 0 8px; font-size: clamp(32px, 8vw, 54px);
      line-height: 1.02; letter-spacing: -.04em;
      background: linear-gradient(90deg, var(--cyan), #fff, var(--purple));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitle { color: #cbd5e1; line-height: 1.6; margin: 0 auto 22px; }
    .photo-wrap { position: relative; }
    .photo {
      display: block; width: 100%; max-height: 560px; object-fit: cover;
      border-radius: 18px; border: 2px solid rgba(103,232,249,.75);
      box-shadow: 0 0 32px rgba(103,232,249,.12);
    }
    .stamp {
      margin: 20px 0 8px; color: var(--yellow); font-weight: 900;
      font-size: clamp(19px, 5vw, 27px); letter-spacing: .04em;
    }
    button {
      margin-top: 14px; border: 0; border-radius: 12px; padding: 14px 20px;
      background: var(--cyan); color: #07111d; font-size: 16px;
      font-weight: 850; cursor: pointer; transition: transform .15s, filter .15s;
    }
    button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #verdict { min-height: 30px; margin-top: 18px; font-weight: 800; color: #fff; }
    footer { color: #94a3b8; font-size: 12px; margin-top: 22px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">THE INTERNET INVESTIGATION</div>
